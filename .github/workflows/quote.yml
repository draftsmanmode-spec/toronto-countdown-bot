name: Send daily quote

on:
  schedule:
    # 12:00 UTC = 8:00am Toronto (EDT) / 2:00pm Cologne (CEST)
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      # make sure today (and the next 30 days) are queued before sending
      - run: python generate_schedule.py

      - run: python send_quote.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          CUSTOMER_CHAT_ID: ${{ secrets.CUSTOMER_CHAT_ID }}
          LANG_MODE: ${{ secrets.LANG_MODE }}

      - run: python update_site.py

      - name: Save quote log, schedule and updated site
        run: |
          if ! git diff --quiet quote_state.json schedule.json docs/index.html; then
            git config user.name "quote-bot"
            git config user.email "actions@github.com"
            git add quote_state.json schedule.json docs/index.html
            git commit -m "Daily quote update [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
