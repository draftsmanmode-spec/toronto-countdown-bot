name: Poll for brother's messages

# Fallback only. While the Vercel webhook is connected, Telegram delivers
# everything instantly through quote.yml and the `check` job below ends in a
# few seconds. If the webhook is ever disconnected, `process` picks up
# messages and button taps here instead (slower: GitHub runs this cron every
# few hours, not every 5 minutes).
#
# Instant mode is live (Oct 2), and Telegram refuses polling while a webhook
# is set, so the old */5 schedule was pure noise and is gone (CI-BUDGET-02).
# If the webhook is ever disconnected, quote.yml's hourly ticks drain taps;
# run this by hand for an immediate catch-up.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - id: mode
        run: python poll_messages.py --check
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}

  process:
    needs: check
    if: needs.check.outputs.mode == 'poll'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # same lock as quote.yml so taps and ticks never edit state at once
    concurrency:
      group: bot-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python poll_messages.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          CUSTOMER_CHAT_ID: ${{ secrets.CUSTOMER_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Save progress
        if: always()
        run: |
          files="state.json approval_state.json quote_state.json docs/index.html"
          if [ -z "$(git status --porcelain -- $files)" ]; then
            echo "No changes to commit."; exit 0
          fi
          git config user.name "countdown-bot"
          git config user.email "actions@github.com"
          for f in $files; do [ -e "$f" ] && git add -- "$f"; done
          git commit -m "update poll offset [skip ci]"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          exit 1
