name: Send daily countdown

# Automatic daily schedule removed on request - this workflow now only runs
# when triggered manually (Actions tab -> Run workflow). The countdown
# still works fine on-demand, it just won't fire on its own anymore.
on:
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: playwright install --with-deps chromium
      - run: python capture_countdown.py
      - run: python send_countdown.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          CUSTOMER_CHAT_ID: ${{ secrets.CUSTOMER_CHAT_ID }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
