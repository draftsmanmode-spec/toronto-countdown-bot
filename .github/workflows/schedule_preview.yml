name: Send schedule preview

on:
  schedule:
    # 14:00 UTC every Saturday = 10:00am Toronto (EDT)
    # Sent to YOU only, so you can review and reroll before the week runs.
    - cron: "0 14 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - run: python generate_schedule.py

      - run: python send_schedule_preview.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          LANG_MODE: ${{ secrets.LANG_MODE }}

      - name: Save schedule
        run: |
          if ! git diff --quiet schedule.json; then
            git config user.name "quote-bot"
            git config user.email "actions@github.com"
            git add schedule.json
            git commit -m "Extend schedule [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
