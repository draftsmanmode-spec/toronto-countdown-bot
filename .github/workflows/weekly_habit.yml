name: Send weekly habit

on:
  schedule:
    # 12:00 UTC every Monday = 8:00am Toronto (EDT) / 2:00pm Cologne (CEST)
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  habit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - run: python generate_schedule.py

      - run: python send_weekly_habit.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          CUSTOMER_CHAT_ID: ${{ secrets.CUSTOMER_CHAT_ID }}
          LANG_MODE: ${{ secrets.LANG_MODE }}

      - name: Save habit log and schedule
        if: always()
        run: |
          if ! git diff --quiet weekly_habit_state.json schedule.json; then
            git config user.name "habit-bot"
            git config user.email "actions@github.com"
            git add weekly_habit_state.json schedule.json
            git commit -m "Weekly habit log update [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
